name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Permissões necessárias para publicar no GitHub Pages nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy simultâneo ativo
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar artefato público
        run: |
          mkdir _site
          cp index.html main.js styles.css scenes.css _site/
          cp -r assets _site/

      - name: Fazer Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
